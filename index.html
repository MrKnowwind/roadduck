<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251c" />
    <title>街头小勇士</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-label="街头小勇士游戏">
        <div id="game"></div>
        <div class="controls" aria-label="移动控制">
          <button class="control up" data-dx="0" data-dy="-1" aria-label="向上">▲</button>
          <button class="control left" data-dx="-1" data-dy="0" aria-label="向左">◀</button>
          <button class="control down" data-dx="0" data-dy="1" aria-label="向下">▼</button>
          <button class="control right" data-dx="1" data-dy="0" aria-label="向右">▶</button>
        </div>
      </section>
      <p class="hint">方向键 / WASD / 滑动屏幕移动</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
